<svg xmlns="http://www.w3.org/2000/svg" width="960" height="492" viewBox="0 0 960 492" role="img" aria-label="dax-glossary command line demo">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1238"/></linearGradient></defs>
<rect width="960" height="492" rx="14" fill="url(#g)" stroke="#ffffff" stroke-opacity="0.12"/>
<rect width="960" height="44" rx="14" fill="#ffffff" fill-opacity="0.05"/>
<circle cx="26" cy="22" r="6.5" fill="#ff5f57"/><circle cx="48" cy="22" r="6.5" fill="#febc2e"/><circle cx="70" cy="22" r="6.5" fill="#28c840"/>
<text x="480" y="27" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3b8">dax-glossary - terminal</text>
<g font-family="Cascadia Code,JetBrains Mono,Consolas,Courier New,monospace" font-size="15" style="white-space:pre">
<text x="28" y="78"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0"> dax-glossary get function TOTALYTD</tspan></text>
<text x="28" y="102" fill="#f0abfc">TOTALYTD  [Time intelligence]  returns scalar</text>
<text x="28" y="126" fill="#7dd3fc">  TOTALYTD(&lt;expression&gt;,&lt;dates&gt; or &lt;calendar&gt;[,&lt;filter&gt;][,&lt;year_end_date&gt;])</text>
<text x="28" y="150" fill="#cbd5e1">  Year-to-date value of an expression.</text>
<text x="28" y="174" fill="#94a3b8">  tags: requires-date-table</text>
<text x="28" y="198" fill="#6ee7b7">  https://learn.microsoft.com/en-us/dax/totalytd-function-dax</text>
<text x="28" y="246"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0"> dax-glossary search rolling</tspan></text>
<text x="28" y="270" fill="#cbd5e1">measure  rolling-12m     Total of the last 12 months ending at the last date in context.</text>
<text x="28" y="294" fill="#cbd5e1">measure  rolling-days    Total of the last N days ending at the last date in context.</text>
<text x="28" y="342"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0"> dax-glossary render yoy-pct --param &#x27;measure_name=Sales YoY %&#x27; \</tspan></text>
<text x="28" y="366" fill="#e2e8f0">    --param &#x27;measure=[Sales]&#x27; --param &quot;dates=&#x27;Date&#x27;[Date]&quot;</text>
<text x="28" y="390" fill="#f0abfc">Sales YoY % =</text>
<text x="28" y="414" fill="#7dd3fc">VAR _prior = CALCULATE([Sales], SAMEPERIODLASTYEAR(&#x27;Date&#x27;[Date]))</text>
<text x="28" y="438" fill="#7dd3fc">RETURN DIVIDE([Sales] - _prior, _prior)</text>
</g></svg>